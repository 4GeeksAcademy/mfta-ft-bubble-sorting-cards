<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="./assets/img/4geeks.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello Rigo with Vanilla.js</title>

    <!-- Fontawesome is our recomended library for icons -->
    <link
      rel="stylesheet"
      href="https://use.fontawesome.com/releases/v5.2.0/css/all.css"
      integrity="sha384-hWVjflwFxL6sNzntih27bfxkr27PmbbK/iSvJ+a4+0owXq79v+lsFkW54bOGbiDQ"
      crossorigin="anonymous"
    />
  </head>
  <body class="bg-success">
    <!-- Write your HTML code here, you can delete everything withing the body tags -->
    <div class="container-fluid text-center p-0">
      <div class="d-flex bg-light p-2 gap-1">
        <input type="number" name="cards-quantity" id="cards-quantity" />
        <button class="btn btn-primary" id="draw-btn">Draw</button>
        <button class="btn btn-warning" id="sort-btn">Sort</button>
      </div>

      <div class="d-flex flex-column align-items-start mb-4 p-2">
        <h2>Original</h2>
        <div class="d-flex p-2 gap-2" id="original-cards-container"></div>
      </div>

      <div class="d-flex flex-column align-items-start mb-4 p-2">
        <h2>Bubble Log</h2>
        <div class="d-flex flex-column p-2 gap-2" id="bubble-log-container"></div>
      </div>
    </div>

    <!-- Do not delete this script tag, this is what connects your HTML with the Javascript code -->
    <script type="module" src="/app.js"></script>
  </body>
</html>
